name: 🌐 TuyBox Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Serverga Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 🔑 SSH kalitini sozlash
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚚 Backend kodni serverga yuklash (rsync)
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='mobile/' \
            --exclude='*.db' \
            --exclude='__pycache__' \
            --exclude='.DS_Store' \
            --exclude='.env' \
            --exclude='logs/' \
            ./backend/ root@82.26.198.220:/var/www/tuyxona/backend/

      - name: 📦 Python kutubxonalarni yangilash
        run: |
          ssh -o StrictHostKeyChecking=no root@82.26.198.220 \
            "cd /var/www/tuyxona && source venv/bin/activate && pip install -r backend/requirements.txt -q"

      - name: 🔄 Xizmatlarni qayta ishga tushirish
        run: |
          ssh -o StrictHostKeyChecking=no root@82.26.198.220 \
            "systemctl restart tuyxona-backend tuyxona-bot"

      - name: ✅ Holat tekshiruvi
        run: |
          sleep 5
          HEALTH=$(curl -sf https://tuybox.asilbek.tech/api/health || echo "ERROR")
          echo "API Holat: $HEALTH"
          if echo "$HEALTH" | grep -q "online"; then
            echo "✅ TuyBox Backend muvaffaqiyatli deploy bo'ldi!"
          else
            echo "❌ Deploy xatosi! Loglarni tekshiring."
            exit 1
          fi
