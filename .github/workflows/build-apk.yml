name: 🚀 TuyBox APK Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Expo Prebuild + Gradle = APK (token kerak emas!)
  # ─────────────────────────────────────────────────────────────
  build-android-apk:
    name: 📦 Build Android APK (Gradle - token kerak emas)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Kodni yuklab olish
        uses: actions/checkout@v4

      - name: ☕ Java 17 sozlash (Android uchun)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Node.js 20 sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Mobile kutubxonalar o'rnatish
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: 🔧 Expo CLI o'rnatish
        run: npm install -g @expo/cli

      - name: 📱 Android native kod generatsiya (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: 1

      - name: 🔑 Release Keystore va Gradle Sozlash
        run: |
          mkdir -p mobile/android/app
          cp mobile/tuybox-release.keystore mobile/android/app/tuybox-release.keystore
          python3 -c "
          path = 'mobile/android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          release_signing = '''
          release {
              storeFile file('tuybox-release.keystore')
              storePassword 'tuybox123'
              keyAlias 'tuybox'
              keyPassword 'tuybox123'
              v1SigningEnabled true
              v2SigningEnabled true
          }
          '''
          if 'signingConfigs {' in content:
              content = content.replace('signingConfigs {', 'signingConfigs {\n' + release_signing)
              content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              with open(path, 'w') as f:
                  f.write(content)
              print('✅ Release signing muvaffaqiyatli ulandi!')
          else:
              print('⚠️ signingConfigs bloki topilmadi!')
          "

      - name: 🏗️ Android APK build (Gradle)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: 🔐 Zipalign va apksigner bilan imzolash & tekshirish
        run: |
          RAW_APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "Topilgan xom APK: $RAW_APK"
          ls -lh "$RAW_APK"

          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          echo "Ishlatilayotgan Build Tools: $BUILD_TOOLS"

          # 1. Zipalign (4-bayt va 4096-bayt page alignment)
          $BUILD_TOOLS/zipalign -p -f 4 "$RAW_APK" TuyBox-aligned.apk

          # 2. SHA-256 bilan v1, v2, v3 sxemalarida rasmiy imzolash
          $BUILD_TOOLS/apksigner sign \
            --ks mobile/tuybox-release.keystore \
            --ks-pass pass:tuybox123 \
            --ks-key-alias tuybox \
            --key-pass pass:tuybox123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out TuyBox.apk TuyBox-aligned.apk

          # 3. Sertifikat va imzo haqiqiyligini tekshirish
          echo "=== APK Signer Rasmiy Tekshiruvi ==="
          $BUILD_TOOLS/apksigner verify --verbose TuyBox.apk

          echo "APK_PATH=TuyBox.apk" >> $GITHUB_ENV
          echo "✅ Tayyor TuyBox.apk hajmi:"
          ls -lh TuyBox.apk

      - name: 📤 APK ni Artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TuyBox-APK
          path: TuyBox.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: APK + Backend serverga deploy
  # ─────────────────────────────────────────────────────────────
  deploy-to-server:
    name: 🌐 Serverga Deploy
    needs: build-android-apk
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 📥 APK yuklab olish
        uses: actions/download-artifact@v4
        with:
          name: TuyBox-APK
          path: dist/

      - name: 🔑 SSH kalitini sozlash
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚚 APK serverga yuklash
        run: |
          APK_FILE=$(find dist/ -name "*.apk" | head -1)
          echo "APK: $APK_FILE"
          scp -o StrictHostKeyChecking=no "$APK_FILE" \
            root@82.26.198.220:/var/www/tuyxona/backend/static/TuyBox.apk
          echo "✅ APK serverga yuklandi!"

      - name: 🌐 Backend kodni serverga yuklash
        run: |
          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git' --exclude='venv' --exclude='mobile/' \
            --exclude='*.db' --exclude='__pycache__' \
            --exclude='.DS_Store' --exclude='.env' \
            ./backend/ root@82.26.198.220:/var/www/tuyxona/backend/

      - name: 🔁 Serverni restart
        run: |
          ssh -o StrictHostKeyChecking=no root@82.26.198.220 \
            "systemctl restart tuyxona-backend tuyxona-bot && sleep 3 && \
             curl -s https://tuybox.asilbek.tech/api/health && echo && \
             ls -lh /var/www/tuyxona/backend/static/TuyBox.apk"

      - name: ✅ Tayyor!
        run: |
          echo "🎉 TuyBox APK deploy muvaffaqiyatli!"
          echo "📲 https://tuybox.asilbek.tech/static/TuyBox.apk"
          echo "🌐 https://tuybox.asilbek.tech"
