name: 🚀 TuyBox APK Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: EAS orqali Android APK Build
  # ─────────────────────────────────────────────────────────────
  build-android-apk:
    name: 📦 Build Android APK (EAS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: ⬇️ Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 🟢 Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # package-lock.json yo'q bo'lsa cache ishlatmaymiz
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Kutubxonalarni o'rnatish
        run: npm install --legacy-peer-deps

      - name: 🔧 EAS CLI o'rnatish
        run: npm install -g eas-cli@latest

      - name: 🏗️ Android APK Build (EAS Preview)
        run: |
          mkdir -p ../dist
          eas build --platform android --profile preview --non-interactive --output ../dist/TuyBox.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 APK ni Artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TuyBox-APK
          path: dist/TuyBox.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Serverni yangilash + APK deploy
  # ─────────────────────────────────────────────────────────────
  deploy-to-server:
    name: 🌐 Serverni Yangilash va APK Deploy
    needs: build-android-apk
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 📥 APK Artifact yuklab olish
        uses: actions/download-artifact@v4
        with:
          name: TuyBox-APK
          path: dist/

      - name: 🔑 SSH kalitini sozlash
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚚 APK ni serverga yuklash
        run: |
          scp -o StrictHostKeyChecking=no dist/TuyBox.apk root@82.26.198.220:/var/www/tuyxona/backend/static/TuyBox.apk
          echo "✅ APK serverga yuklandi!"

      - name: 🌐 Backend kodni serverga yuklash (rsync)
        run: |
          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='mobile/' \
            --exclude='*.db' \
            --exclude='__pycache__' \
            --exclude='.DS_Store' \
            --exclude='.env' \
            --exclude='node_modules' \
            ./backend/ root@82.26.198.220:/var/www/tuyxona/backend/

      - name: 🔁 Serverni restart va tekshiruv
        run: |
          ssh -o StrictHostKeyChecking=no root@82.26.198.220 \
            "systemctl restart tuyxona-backend tuyxona-bot && sleep 3 && \
             curl -s https://tuybox.asilbek.tech/api/health && \
             echo '' && ls -lh /var/www/tuyxona/backend/static/TuyBox.apk"

      - name: ✅ Deploy muvaffaqiyatli xabari
        run: |
          echo "🎉 TuyBox muvaffaqiyatli deploy bo'ldi!"
          echo "🌐 https://tuybox.asilbek.tech"
          echo "📲 https://tuybox.asilbek.tech/static/TuyBox.apk"
