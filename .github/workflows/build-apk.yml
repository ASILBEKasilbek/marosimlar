name: 🚀 TuyBox APK Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Expo Prebuild + Gradle = APK (token kerak emas!)
  # ─────────────────────────────────────────────────────────────
  build-android-apk:
    name: 📦 Build Android APK (Gradle - token kerak emas)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Kodni yuklab olish
        uses: actions/checkout@v4

      - name: ☕ Java 17 sozlash (Android uchun)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Node.js 20 sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Mobile kutubxonalar o'rnatish
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: 🔧 Expo CLI o'rnatish
        run: npm install -g @expo/cli

      - name: 📱 Android native kod generatsiya (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          # Token kerak emas - offline mode
          EXPO_NO_DOTENV: 1

      - name: 🏗️ Android APK build (Gradle)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: 📂 APK fayl topish
        run: |
          find mobile/android -name "*.apk" -type f
          APK_PATH=$(find mobile/android -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK topildi: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: 📤 APK ni Artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TuyBox-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: APK + Backend serverga deploy
  # ─────────────────────────────────────────────────────────────
  deploy-to-server:
    name: 🌐 Serverga Deploy
    needs: build-android-apk
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 📥 APK yuklab olish
        uses: actions/download-artifact@v4
        with:
          name: TuyBox-APK
          path: dist/

      - name: 🔑 SSH kalitini sozlash
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚚 APK serverga yuklash
        run: |
          APK_FILE=$(find dist/ -name "*.apk" | head -1)
          echo "APK: $APK_FILE"
          scp -o StrictHostKeyChecking=no "$APK_FILE" \
            root@82.26.198.220:/var/www/tuyxona/backend/static/TuyBox.apk
          echo "✅ APK serverga yuklandi!"

      - name: 🌐 Backend kodni serverga yuklash
        run: |
          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git' --exclude='venv' --exclude='mobile/' \
            --exclude='*.db' --exclude='__pycache__' \
            --exclude='.DS_Store' --exclude='.env' \
            ./backend/ root@82.26.198.220:/var/www/tuyxona/backend/

      - name: 🔁 Serverni restart
        run: |
          ssh -o StrictHostKeyChecking=no root@82.26.198.220 \
            "systemctl restart tuyxona-backend tuyxona-bot && sleep 3 && \
             curl -s https://tuybox.asilbek.tech/api/health && echo && \
             ls -lh /var/www/tuyxona/backend/static/TuyBox.apk"

      - name: ✅ Tayyor!
        run: |
          echo "🎉 TuyBox APK deploy muvaffaqiyatli!"
          echo "📲 https://tuybox.asilbek.tech/static/TuyBox.apk"
          echo "🌐 https://tuybox.asilbek.tech"
